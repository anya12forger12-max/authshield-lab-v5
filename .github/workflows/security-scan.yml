name: Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install audit tools
        run: pip install pip-audit safety

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Python dependency audit with pip-audit
        run: pip-audit -r backend/requirements.txt --desc --format json -o pip-audit-results.json || true

      - name: Python dependency audit with safety
        run: safety check --json --output safety-results.json || true

      - name: npm audit
        run: |
          cd frontend
          npm audit --json > ../npm-audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-results
          path: |
            pip-audit-results.json
            safety-results.json
            npm-audit-results.json
          if-no-files-found: warn
          retention-days: 30

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        run: |
          python3 - <<'EOF'
          import pathlib
          import re
          skip = {"node_modules", ".git", "__pycache__", "dist", "build", ".venv", "venv", ".tox"}
          suffixes = {".py", ".ts", ".tsx", ".js", ".jsx", ".yml", ".yaml", ".json", ".env", ".toml", ".sh"}
          pattern = re.compile(
              r"(api[_-]?key|secret|password|passwd|access[_-]?token|client[_-]?secret|private[_-]?key)"
              r"\s*[:=]\s*[\"'][^\"']{8,}",
              re.IGNORECASE,
          )
          hits = []
          for p in pathlib.Path(".").rglob("*"):
              if (
                  p.is_file()
                  and p.suffix in suffixes
                  and not any(part in skip for part in p.parts)
              ):
                  try:
                      for i, line in enumerate(p.read_text(errors="ignore").splitlines(), 1):
                          if pattern.search(line) and "[" not in line[:8]:
                              hits.append(f"{p}:{i}")
                  except Exception:
                      pass
          if hits:
              print("::warning::Potential hardcoded secrets found in codebase")
              for h in hits[:50]:
                  print(h)
          else:
              print("No potential hardcoded secrets detected.")
          EOF
        continue-on-error: true

      - name: Check for .env files
        run: |
          if find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*" | grep -q .; then
            echo "::warning::Found .env files in the repository"
            find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*"
          else
            echo "No .env files found."
          fi

      - name: Check gitignore for sensitive patterns
        run: |
          if [ -f .gitignore ]; then
            echo "Checking .gitignore covers sensitive files..."
            for pattern in ".env" "*.pem" "*.key" "*.p12" "*.pfx" "credentials.json" "service-account*.json"; do
              if grep -q "$pattern" .gitignore 2>/dev/null; then
                echo "  OK: $pattern is in .gitignore"
              else
                echo "  WARNING: $pattern is NOT in .gitignore"
              fi
            done
          else
            echo "No .gitignore found."
          fi

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SBOM tools
        run: pip install cyclonedx-bom

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Generate Python SBOM
        run: |
          cyclonedx-py requirements --input-file backend/requirements.txt --format json --output-file sbom-python.json || \
          echo '{"error": "Could not generate Python SBOM"}' > sbom-python.json

      - name: Generate npm SBOM
        run: |
          cd frontend
          npx --no-install @cyclonedx/cyclonedx-npm --output-file ../sbom-npm.json || \
          echo '{"error": "Could not generate npm SBOM"}' > ../sbom-npm.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-python.json
            sbom-npm.json
          if-no-files-found: warn
          retention-days: 90