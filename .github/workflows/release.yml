name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tools
        run: pip install ruff mypy pytest pytest-cov pip-audit

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Lint
        run: |
          ruff check backend/
          ruff format --check backend/
        continue-on-error: true

      - name: Type check
        run: mypy --strict backend/
        continue-on-error: true

      - name: Unit tests
        run: pytest backend/tests/unit/ --cov=backend -v
        continue-on-error: true

      - name: Security audit
        run: |
          pip-audit -r backend/requirements.txt
          cd frontend && npm audit --audit-level=moderate
        continue-on-error: true

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python build dependencies
        run: pip install build twine

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Build backend packages
        run: |
          cd backend
          python -m build
        continue-on-error: true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            backend/dist/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 5

  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Generate SHA256 checksums
        run: |
          cd dist
          if ls ./* >/dev/null 2>&1; then
            sha256sum ./* > SHA256SUMS.txt
            echo "Checksums generated:"
            cat SHA256SUMS.txt
          else
            echo "No build artifacts to checksum."
          fi

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 5

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, checksums]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-artifacts
          path: dist/

      - name: Download checksums
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: checksums
          path: dist/

      - name: Check artifacts exist
        id: check-artifacts
        run: |
          if ls dist/* >/dev/null 2>&1; then
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            git log --oneline --no-decorate >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            git log --oneline --no-decorate ${PREV_TAG}..HEAD >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Sign commit with GPG
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for file in dist/*; do
            if [ -f "$file" ] && [ "$file" != "dist/SHA256SUMS.txt" ]; then
              gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --detach-sign "$file"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.check-artifacts.outputs.has_files == 'true'
        with:
          name: AuthShield Lab ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changes }}

            ## Installation

            Download the appropriate package for your platform and verify checksums using the included `SHA256SUMS.txt`.

            ## Verification

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}