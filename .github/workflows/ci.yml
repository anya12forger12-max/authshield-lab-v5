name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tools
        run: pip install ruff mypy pytest pytest-cov

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Python linting with ruff
        run: ruff check backend/
        continue-on-error: true

      - name: Python format check with ruff
        run: ruff format --check backend/
        continue-on-error: true

      - name: TypeScript linting with ESLint
        run: |
          cd frontend
          npm run lint
        continue-on-error: true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tools
        run: pip install mypy

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Python type checking with mypy
        run: mypy --strict backend/
        continue-on-error: true

      - name: TypeScript type checking
        run: |
          cd frontend
          npm run typecheck
        continue-on-error: true

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tools
        run: pip install pytest pytest-cov

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Run Python unit tests with coverage
        run: pytest backend/tests/unit/ --cov=backend --cov-report=xml:coverage-unit.xml --cov-report=html:htmlcov-unit -v
        continue-on-error: true

      - name: Run JavaScript unit tests
        run: |
          cd frontend
          npm run test -- --run
        continue-on-error: true

      - name: Upload Python coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            coverage-unit.xml
            htmlcov-unit/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python tools
        run: pip install pytest

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Run integration tests
        run: pytest backend/tests/integration/ -v
        continue-on-error: true

  accessibility:
    name: Accessibility Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Basic a11y attribute scan
        run: |
          grep -rEn '<img|alt=' frontend/src frontend/index.html || echo "no img/alt usage found"
          echo "Full axe/pa11y audits need a running app and are not wired up for this repo yet."
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python audit tools
        run: pip install pip-audit

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Python dependency audit
        run: pip-audit
        continue-on-error: true

      - name: npm audit
        run: |
          cd frontend
          npm audit --audit-level=moderate
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python build tooling
        run: pip install build

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
        continue-on-error: true

      - name: Build backend packages
        run: |
          cd backend
          python -m build
        continue-on-error: true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            backend/dist/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 7